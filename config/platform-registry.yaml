# 虚拟人平台注册表
# 用于自动识别项目类型、平台特征和能力支持

platforms:
  web:
    name: "Web / 浏览器"
    detection:
      required_any:
        - pattern: "package.json"
          and:
            - pattern: "index.html"
        - pattern: "*.html"
          and:
            - pattern: "*/avatar-sdk-web*"
      optional:
        - pattern: "vite.config.*"
        - pattern: "webpack.config.*"
        - pattern: "tsconfig.json"

    sdk:
      format: "esm"
      entry: "index.js"
      players:
        - "xrtc-player-*.js"
        - "webrtc-player-*.js"
      types: "index.d.ts"

    features:
      text_driver: true
      text_interact: true
      audio_driver: true
      voice_interact: true
      full_duplex: true
      transparent_bg: true
      action_control: true
      subtitle: true
      live_photo: false

    protocols:
      - name: "xrtc"
        recommended: true
        supports_alpha: true
      - name: "webrtc"
        recommended: false
        supports_alpha: false
      - name: "rtmp"
        recommended: false
        supports_alpha: false

    environment:
      https_required: true  # 录音功能必需
      https_or_localhost: true
      browser_api:
        - "navigator.mediaDevices"
        - "WebSocket"
        - "WebRTC"

    toolchain:
      required: false
      optional:
        - name: "Node.js"
          version: ">=14"
          purpose: "本地开发服务器"
        - name: "静态服务器"
          tools:
            - "npx serve"
            - "python -m http.server"
            - "php -S localhost:8080"

    permissions:
      microphone: "navigator.mediaDevices.getUserMedia"
      auto_play: "用户交互后调用 player.resume()"

    common_issues:
      - issue: "无声音"
        cause: "浏览器自动播放限制"
        fix: "监听 PlayNotAllowed 事件，引导用户点击页面"
      - issue: "麦克风无法使用"
        cause: "非 HTTPS 环境"
        fix: "配置 HTTPS 或使用 localhost"
      - issue: "SDK 加载失败"
        cause: "ESM 格式不兼容"
        fix: "使用静态服务器或配置构建工具"

  android:
    name: "Android"
    detection:
      required_any:
        - pattern: "build.gradle"
          and:
            - pattern: "AndroidManifest.xml"
        - pattern: "app/build.gradle"
          and:
            - pattern: "app/src/main/AndroidManifest.xml"

    sdk:
      format: "aar"
      files:
        - "avatar-core-v*.aar"
        - "xrtcsdk-*.aar"  # XRTC 协议时必需
      location: "app/libs/"
      architectures:
        - "armeabi-v7a"
        - "arm64-v8a"

    features:
      text_driver: true
      text_interact: true
      audio_driver: true
      voice_interact: true
      full_duplex: true
      transparent_bg: true
      action_control: true
      subtitle: true
      live_photo: true

    protocols:
      - name: "xrtc"
        recommended: true
        supports_alpha: true
      - name: "webrtc"
        recommended: false
        supports_alpha: false
      - name: "rtmp"
        recommended: false
        supports_alpha: false

    environment:
      min_sdk_version: 21
      compile_sdk_version: 33
      target_sdk_version: 33

    toolchain:
      required: true
      items:
        - name: "Gradle"
          version: ">=7.0"
          check: "./gradlew --version"
        - name: "Android SDK"
          check: "echo $ANDROID_HOME"
        - name: "JDK"
          version: ">=8"
          check: "java -version"

    permissions:
      required:
        - "android.permission.INTERNET"
        - "android.permission.ACCESS_NETWORK_STATE"
      optional:
        - name: "android.permission.RECORD_AUDIO"
          when: "使用录音功能"
          runtime: true
        - name: "android.permission.WRITE_EXTERNAL_STORAGE"
          when: "保存日志"
          runtime: true

    gradle_config:
      required:
        - |
          android {
              defaultConfig {
                  minSdkVersion 21
              }
              sourceSets {
                  main {
                      jniLibs.srcDirs = ['libs']
                  }
              }
          }
        - |
          dependencies {
              implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
              implementation 'com.squareup.okhttp3:okhttp:3.11.0'
          }

    common_issues:
      - issue: "初始化失败"
        cause: "AAR 未正确引入或签名配置错误"
        fix: "检查 Embed & Sign 配置，确保 AAR 在 libs 目录"
      - issue: "黑屏无视频"
        cause: "播放器依赖缺失或 ABI 不匹配"
        fix: "检查 XRTC SDK 是否引入，ABI 配置是否正确"
      - issue: "录音无反应"
        cause: "未申请录音权限或运行时拒绝"
        fix: "添加 RECORD_AUDIO 权限并在运行时申请"

  ios:
    name: "iOS"
    detection:
      required_any:
        - pattern: "*.xcodeproj"
          and:
            - pattern: "Info.plist"
        - pattern: "*.xcworkspace"
          and:
            - pattern: "Podfile"

    sdk:
      format: "framework"
      files:
        - "AvatarSDK.framework"
        - "XRTCSDK.framework"  # XRTC 协议时必需
      embed_mode: "Embed & Sign"
      system_libs:
        - "libc++.tbd"

    features:
      text_driver: true
      text_interact: true
      audio_driver: true
      voice_interact: true
      full_duplex: true
      transparent_bg: true
      action_control: true
      subtitle: true
      live_photo: true

    protocols:
      - name: "xrtc"
        recommended: true
        supports_alpha: true
      - name: "webrtc"
        recommended: false
        supports_alpha: false
      - name: "rtmp"
        recommended: false
        supports_alpha: false

    environment:
      min_ios_version: "11.0"
      xcode_version: ">=12.0"

    toolchain:
      required: true
      items:
        - name: "Xcode"
          check: "xcode-select -p"
        - name: "CocoaPods"
          version: ">=1.10"
          check: "pod --version"
          optional: true
          when: "使用 Pods 管理依赖"

    permissions:
      required:
        - name: "NSMicrophoneUsageDescription"
          location: "Info.plist"
          when: "使用录音功能"
          example: "<string>用于虚拟人语音交互</string>"

    build_settings:
      required:
        - name: "ENABLE_BITCODE"
          value: "NO"
          reason: "SDK 不支持 Bitcode"
        - name: "Bundle ID"
          required: true
        - name: "Team"
          required: true

    common_issues:
      - issue: "Framework 加载失败"
        cause: "未配置 Embed & Sign"
        fix: "Target → General → Frameworks → 设置为 Embed & Sign"
      - issue: "录音权限拒绝"
        cause: "Info.plist 未配置 NSMicrophoneUsageDescription"
        fix: "添加麦克风权限说明"
      - issue: "真机运行签名失败"
        cause: "Bundle ID 或 Team 未配置"
        fix: "在 Xcode 中配置签名证书和 Bundle ID"

# 特性支持矩阵
feature_matrix:
  text_driver:
    web: true
    android: true
    ios: true
    description: "文本驱动虚拟人播报"

  text_interact:
    web: true
    android: true
    ios: true
    requires:
      - "开通大模型对话能力"
    description: "文本经 NLP/大模型理解后回答"

  audio_driver:
    web: true
    android: true
    ios: true
    description: "使用音频文件驱动虚拟人"

  voice_interact:
    web: true
    android: true
    ios: true
    requires:
      - "麦克风权限"
      - "ASR 能力"
    description: "语音识别后交互"

  full_duplex:
    web: true
    android: true
    ios: true
    requires:
      - "全双工服务能力"
      - "实时 ASR"
    description: "实时语音识别与理解"

  transparent_bg:
    web: true
    android: true
    ios: true
    requires:
      - "protocol: xrtc"
      - "alpha: 1"
    note: "超拟人形象不支持"
    description: "透明背景渲染"

  action_control:
    web: true
    android: true
    ios: true
    requires:
      - "形象支持动作"
    description: "独立动作控制"

  subtitle:
    web: true
    android: true
    ios: true
    note: "透明背景和 3D 形象不支持云端字幕"
    description: "字幕显示"

  live_photo:
    web: false
    android: true
    ios: true
    requires:
      - "活照片形象 ID"
      - "图片 URL"
    description: "活照片形象"

# 错误码快速索引
error_codes:
  connection:
    "10110": "appId 不存在或格式错误"
    "10113": "apiSecret 错误或签名生成有误"
    "10114": "sceneId 不存在或未发布"
    "10120": "avatarId 未授权"
    "10121": "vcn 未授权"

  network:
    "10200": "网络连接超时"
    "10201": "WebSocket 握手失败"
    "10202": "流媒体服务不可达"

  runtime:
    "20001": "SDK 初始化失败"
    "20002": "播放器创建失败"
    "20003": "录音器启动失败"

  player:
    "700002": "设备不支持 H.264 解码"
    "700003": "播放器渲染超时"

# 协议支持矩阵
protocol_matrix:
  xrtc:
    web: true
    android: true
    ios: true
    transparent_bg: true
    latency: "low"
    recommended: true

  webrtc:
    web: true
    android: true
    ios: true
    transparent_bg: false
    latency: "medium"
    recommended: false

  rtmp:
    web: false
    android: false
    ios: false
    transparent_bg: false
    latency: "high"
    recommended: false

# 最小系统要求
system_requirements:
  web:
    browser:
      chrome: ">=80"
      firefox: ">=75"
      safari: ">=13"
      edge: ">=80"
    https: true
    webrtc: true

  android:
    min_sdk: 21
    recommended_sdk: 28
    arch:
      - "armeabi-v7a"
      - "arm64-v8a"

  ios:
    min_version: "11.0"
    recommended_version: "13.0"
    arch: "arm64"
