# 虚拟人平台错误码映射
# 用于快速诊断和给出修复建议

errors:
  # === 连接与鉴权类错误 ===
  "10110":
    category: "authentication"
    severity: "critical"
    message: "appId 不存在或格式错误"
    cause:
      - "appId 未在平台注册"
      - "appId 拼写错误或复制时包含空格/换行"
      - "appId 已被删除或禁用"
    fix:
      - "检查 appId 拼写，确保无多余字符"
      - "登录控制台-应用管理，确认 appId 存在"
      - "重新创建应用并获取新的 appId"
    docs: "https://doc.xfyun.cn/avatar/auth"

  "10113":
    category: "authentication"
    severity: "critical"
    message: "apiSecret 错误或签名生成有误"
    cause:
      - "apiSecret 复制错误"
      - "签名算法实现不正确"
      - "时间戳偏差过大（date 格式错误）"
      - "URL 编码问题"
    fix:
      - "重新复制 apiSecret，确保完整无误"
      - "检查签名生成流程: HMAC-SHA256 → Base64"
      - "确认 date 使用 UTC 时区 GMT 格式"
      - "检查 authorization 参数是否正确 URL 编码"
    code_example: |
      // 正确的签名流程
      const origin = `host: ${host}\ndate: ${date}\nGET ${path} HTTP/1.1`;
      const signature = hmacSha256(apiSecret, origin);
      const authorization = `api_key="${apiKey}", algorithm="hmac-sha256", headers="host date request-line", signature="${signature}"`;
      const authBase64 = base64Encode(authorization);
    docs: "https://doc.xfyun.cn/avatar/auth#鉴权流程"

  "10114":
    category: "configuration"
    severity: "critical"
    message: "sceneId 不存在或未发布"
    cause:
      - "sceneId 拼写错误"
      - "接口服务未保存或未发布"
      - "接口服务已被删除"
    fix:
      - "登录控制台-接口服务，确认 sceneId 存在"
      - "点击接口服务的「保存」和「发布」按钮"
      - "确保 sceneId 复制正确"
    docs: "https://doc.xfyun.cn/avatar/scene-config"

  "10120":
    category: "resource"
    severity: "critical"
    message: "avatarId 未授权"
    cause:
      - "avatarId 未在接口服务中授权"
      - "avatarId 拼写错误"
      - "形象已下线或不可用"
    fix:
      - "登录控制台-接口服务-形象列表"
      - "勾选需要的形象并保存"
      - "超拟人形象 ID 需要带 'cnr' 前缀"
    docs: "https://doc.xfyun.cn/avatar/resource-auth"

  "10121":
    category: "resource"
    severity: "critical"
    message: "vcn（发音人）未授权"
    cause:
      - "vcn 未在接口服务中授权"
      - "vcn 拼写错误"
      - "发音人已下线"
    fix:
      - "登录控制台-接口服务-声音列表"
      - "勾选需要的发音人并保存"
      - "确认 vcn 拼写正确"
    docs: "https://doc.xfyun.cn/avatar/resource-auth"

  # === 网络类错误 ===
  "10200":
    category: "network"
    severity: "high"
    message: "网络连接超时"
    cause:
      - "网络不可达"
      - "防火墙阻止 WebSocket 连接"
      - "代理配置错误"
      - "DNS 解析失败"
    fix:
      - "检查网络连接是否正常"
      - "确认防火墙放行 wss://avatar.cn-huadong-1.xf-yun.com"
      - "尝试关闭代理或配置正确的代理规则"
      - "ping avatar.cn-huadong-1.xf-yun.com 测试 DNS"
    docs: "https://doc.xfyun.cn/avatar/network"

  "10201":
    category: "network"
    severity: "high"
    message: "WebSocket 握手失败"
    cause:
      - "服务地址错误"
      - "TLS 证书验证失败"
      - "中间代理拦截"
    fix:
      - "确认服务地址为 wss://avatar.cn-huadong-1.xf-yun.com/v1/interact"
      - "生产环境不要开启 trustAllSSLCertificates"
      - "检查企业网络是否有 SSL 拦截"
    docs: "https://doc.xfyun.cn/avatar/network"

  "10202":
    category: "network"
    severity: "medium"
    message: "流媒体服务不可达"
    cause:
      - "XRTC/WebRTC 端口被阻止"
      - "NAT 穿透失败"
      - "网络质量差"
    fix:
      - "检查防火墙是否阻止 UDP 流量"
      - "尝试更换网络环境"
      - "降低视频码率和帧率"
    docs: "https://doc.xfyun.cn/avatar/streaming"

  # === SDK 初始化类错误 ===
  "20001":
    category: "sdk"
    severity: "critical"
    message: "SDK 初始化失败"
    platforms:
      web:
        cause:
          - "SDK 文件路径错误"
          - "ESM 模块加载失败"
          - "凭据参数缺失"
        fix:
          - "检查 SDK 文件路径是否正确"
          - "确认在 HTTPS 或 localhost 环境下"
          - "检查 appId/apiKey/apiSecret 是否传入"
      android:
        cause:
          - "AAR 未正确引入"
          - "Context 为 null"
          - "凭据参数错误"
        fix:
          - "检查 app/libs/ 下是否有 avatar-core-*.aar"
          - "确认 Gradle 配置了 fileTree(dir: 'libs')"
          - "检查传入的 Context 是否为 ApplicationContext"
      ios:
        cause:
          - "Framework 未正确嵌入"
          - "config 参数错误"
          - "凭据参数缺失"
        fix:
          - "检查 Framework 是否配置为 Embed & Sign"
          - "确认 AvatarPlatformConfig 参数完整"
          - "检查 apiKey/apiSecret 是否正确"
    docs: "https://doc.xfyun.cn/avatar/sdk-init"

  "20002":
    category: "sdk"
    severity: "high"
    message: "播放器创建失败"
    platforms:
      web:
        cause:
          - "播放器分包未加载"
          - "协议不支持"
        fix:
          - "检查 xrtc-player-*.js 是否与 SDK 同目录"
          - "确认 protocol 为 'xrtc' 或 'webrtc'"
      android:
        cause:
          - "XRTC SDK 未引入"
          - "播放器依赖缺失"
        fix:
          - "检查 app/libs/ 下是否有 xrtcsdk-*.aar"
          - "确认使用 'xrtc' 协议时引入了 XRTC SDK"
      ios:
        cause:
          - "XRTCSDK.framework 未引入"
          - "renderView 未设置"
        fix:
          - "检查 XRTCSDK.framework 是否 Embed & Sign"
          - "确认 player.renderView 已设置"
    docs: "https://doc.xfyun.cn/avatar/player"

  "20003":
    category: "sdk"
    severity: "high"
    message: "录音器启动失败"
    platforms:
      web:
        cause:
          - "非 HTTPS 环境"
          - "麦克风权限被拒绝"
          - "浏览器不支持 MediaDevices API"
        fix:
          - "切换到 HTTPS 或 localhost 环境"
          - "引导用户允许麦克风权限"
          - "检查 navigator.mediaDevices 是否存在"
      android:
        cause:
          - "未申请 RECORD_AUDIO 权限"
          - "运行时权限被拒绝"
          - "录音器初始化参数错误"
        fix:
          - "AndroidManifest.xml 添加 RECORD_AUDIO 权限"
          - "在运行时申请录音权限"
          - "检查采样率、声道等参数是否正确"
      ios:
        cause:
          - "Info.plist 未配置 NSMicrophoneUsageDescription"
          - "用户拒绝麦克风权限"
          - "音频会话配置错误"
        fix:
          - "Info.plist 添加 NSMicrophoneUsageDescription"
          - "引导用户到设置中开启麦克风权限"
          - "检查 AVAudioSession 配置"
    docs: "https://doc.xfyun.cn/avatar/recorder"

  # === 播放器类错误 ===
  "700002":
    category: "player"
    severity: "high"
    message: "设备不支持 H.264 解码"
    cause:
      - "设备硬件不支持 H.264"
      - "浏览器版本过低"
      - "Android 设备缺少解码器"
    fix:
      - "Web: 升级浏览器到最新版本"
      - "Android: 确认设备支持 H.264 硬解"
      - "尝试降低视频分辨率"
    docs: "https://doc.xfyun.cn/avatar/player-compatibility"

  "700003":
    category: "player"
    severity: "high"
    message: "播放器渲染超时"
    cause:
      - "网络质量差，首帧未到达"
      - "播放器配置错误"
      - "视频流推送异常"
    fix:
      - "检查网络连接质量"
      - "检查 renderTimeout 配置是否过短"
      - "查看服务端是否正常推流（stream_start 事件）"
    docs: "https://doc.xfyun.cn/avatar/player-timeout"

  # === 浏览器特有错误 ===
  "NotAllowedError":
    category: "browser"
    severity: "high"
    message: "浏览器自动播放被阻止"
    platforms:
      web:
        cause:
          - "浏览器自动播放策略限制"
          - "页面未发生用户交互"
        fix:
          - "监听 PlayerEvents.playNotAllowed 事件"
          - "引导用户点击页面任意处"
          - "调用 player.resume() 恢复播放"
        code_example: |
          player.on(PlayerEvents.playNotAllowed, () => {
            // 显示提示: "请点击页面以开始播放"
            document.addEventListener('click', () => {
              player.resume();
            }, { once: true });
          });
    docs: "https://doc.xfyun.cn/avatar/browser-autoplay"

  "NotSupportedError":
    category: "browser"
    severity: "critical"
    message: "浏览器不支持 WebRTC"
    platforms:
      web:
        cause:
          - "浏览器版本过低"
          - "浏览器不支持 WebRTC API"
        fix:
          - "升级浏览器到最新版本"
          - "推荐使用 Chrome/Edge/Firefox/Safari 现代浏览器"
          - "检查 navigator.mediaDevices 是否存在"
    docs: "https://doc.xfyun.cn/avatar/browser-compatibility"

  # === Android 特有错误 ===
  "AvatarError.SDK_NOT_INIT":
    category: "sdk"
    severity: "critical"
    message: "SDK 未初始化"
    platforms:
      android:
        cause:
          - "未调用 AvatarPlatform.initialize"
          - "初始化失败但未检查返回值"
        fix:
          - "在使用 SDK 前调用 initialize"
          - "检查 initialize 返回的 AvatarError"
          - "确保初始化成功后再获取 controller"
        code_example: |
          AvatarError error = AvatarPlatform.initialize(context, config);
          if (!error.isSuccess()) {
              Log.e(TAG, "初始化失败: " + error.getDesc());
              return;
          }
    docs: "https://doc.xfyun.cn/avatar/android-init"

  "UnsatisfiedLinkError":
    category: "ndk"
    severity: "critical"
    message: "Native 库加载失败"
    platforms:
      android:
        cause:
          - "so 文件未打包到 APK"
          - "ABI 架构不匹配"
          - "NDK 版本不兼容"
        fix:
          - "检查 app/libs/ 下的 AAR 是否包含 so"
          - "检查 ndk.abiFilters 配置"
          - "确认目标设备架构与打包的 ABI 一致"
        code_example: |
          // build.gradle
          android {
              defaultConfig {
                  ndk {
                      abiFilters 'armeabi-v7a', 'arm64-v8a'
                  }
              }
          }
    docs: "https://doc.xfyun.cn/avatar/android-ndk"

  # === iOS 特有错误 ===
  "dyld: Library not loaded":
    category: "framework"
    severity: "critical"
    message: "Framework 加载失败"
    platforms:
      ios:
        cause:
          - "Framework 未配置为 Embed & Sign"
          - "Framework 路径错误"
          - "签名问题"
        fix:
          - "Target → General → Frameworks → Embed & Sign"
          - "检查 Framework Search Paths"
          - "Clean Build Folder 后重新编译"
    docs: "https://doc.xfyun.cn/avatar/ios-framework"

  "AVAudioSessionErrorCodeCannotInterruptOthers":
    category: "audio"
    severity: "medium"
    message: "音频会话被其他 App 占用"
    platforms:
      ios:
        cause:
          - "其他 App 正在播放音频"
          - "来电或系统音频中断"
          - "AVAudioSession category 配置不当"
        fix:
          - "监听 AVAudioSessionInterruptionNotification"
          - "中断后重新激活 audio session"
          - "配置合适的 category 和 mode"
        code_example: |
          [[NSNotificationCenter defaultCenter]
              addObserver:self
              selector:@selector(handleInterruption:)
              name:AVAudioSessionInterruptionNotification
              object:nil];
    docs: "https://doc.xfyun.cn/avatar/ios-audio-session"

# 常见问题场景映射
scenarios:
  no_video:
    symptoms:
      - "黑屏"
      - "视频区域空白"
      - "页面正常但没有虚拟人"
    possible_errors:
      - "20002"  # 播放器创建失败
      - "700002"  # 不支持 H.264
      - "700003"  # 渲染超时
      - "10120"  # avatarId 未授权
    diagnostic_steps:
      - "检查控制台是否有错误日志"
      - "确认收到 stream_start 事件"
      - "检查播放器是否创建成功"
      - "检查 avatarId 是否授权"

  no_audio:
    symptoms:
      - "画面有但无声音"
      - "嘴巴动但听不到声音"
    possible_errors:
      - "NotAllowedError"  # 浏览器自动播放限制
      - "AVAudioSessionError"  # iOS 音频会话
    diagnostic_steps:
      - "Web: 检查是否收到 playNotAllowed 事件"
      - "Web: 引导用户点击页面后调用 player.resume()"
      - "Android: 检查系统音量和静音状态"
      - "iOS: 检查 AVAudioSession 配置"

  connection_failed:
    symptoms:
      - "无法连接"
      - "初始化失败"
      - "WebSocket 连接超时"
    possible_errors:
      - "10110"  # appId 错误
      - "10113"  # apiSecret 错误
      - "10114"  # sceneId 错误
      - "10200"  # 网络超时
    diagnostic_steps:
      - "检查凭据拼写"
      - "测试网络连通性"
      - "检查防火墙配置"
      - "查看完整错误码"

  recording_failed:
    symptoms:
      - "麦克风无法使用"
      - "录音无反应"
      - "权限拒绝"
    possible_errors:
      - "20003"  # 录音器启动失败
      - "NotAllowedError"  # 权限拒绝
    diagnostic_steps:
      - "Web: 确认在 HTTPS 或 localhost"
      - "检查权限配置（AndroidManifest / Info.plist）"
      - "运行时申请权限"
      - "检查系统设置中的麦克风权限"

# 诊断流程
diagnostic_flow:
  step1:
    name: "收集错误信息"
    actions:
      - "记录错误码"
      - "记录错误消息"
      - "记录平台和 SDK 版本"
      - "截图或录屏"
      - "导出日志"

  step2:
    name: "查询错误码"
    actions:
      - "在本文件中搜索错误码"
      - "查看 cause 和 fix"
      - "参考 code_example"

  step3:
    name: "执行修复"
    actions:
      - "按照 fix 建议逐项检查"
      - "修改代码或配置"
      - "重新编译/运行"

  step4:
    name: "验证修复"
    actions:
      - "重新执行失败的操作"
      - "检查错误是否消失"
      - "测试完整功能"

  step5:
    name: "无法解决时"
    actions:
      - "查看相关文档"
      - "联系技术支持并提供:"
          - "错误码和消息"
          - "appId 和 sceneId"
          - "SDK 版本"
          - "完整日志"
          - "复现步骤"
